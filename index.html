<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Minecraft Compass</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            background: #111;
            color: white;

            font-family: Arial, sans-serif;
        }

        h1 {
            margin-bottom: 25px;
        }

        #compass {
            width: 160px;
            height: 160px;

            image-rendering: pixelated;
        }

        #direction {
            margin-top: 20px;
            font-size: 22px;
        }

        #frameInfo {
            margin-top: 8px;
            font-size: 16px;
        }

        #sensorInfo {
            margin-top: 20px;
            padding: 12px;

            width: 90%;
            max-width: 400px;

            background: #222;

            font-size: 14px;
            line-height: 1.6;

            text-align: center;
        }

        button {
            margin-top: 20px;

            padding: 12px 24px;

            border: none;
            border-radius: 6px;

            font-size: 16px;
        }

        button:disabled {
            opacity: 0.5;
        }
    </style>
</head>

<body>

    <h1>Minecraft Compass</h1>

    <img
        id="compass"
        src="compass/frame_0001.png"
        alt="Minecraft Compass"
    >

    <div id="direction">
        방향: --°
    </div>

    <div id="frameInfo">
        프레임: 1 / 28
    </div>

    <div id="sensorInfo">
        센서 대기 중...
    </div>

    <button id="startButton">
        나침반 시작
    </button>


<script>

    // =========================================
    // 기본 설정
    // =========================================

    const FRAME_COUNT = 28;

    const compassImage =
        document.getElementById("compass");

    const directionText =
        document.getElementById("direction");

    const frameInfo =
        document.getElementById("frameInfo");

    const sensorInfo =
        document.getElementById("sensorInfo");

    const startButton =
        document.getElementById("startButton");


    // =========================================
    // 현재 방향
    // =========================================

    let currentHeading = 0;


    // =========================================
    // 각도를 0~360도로 정리
    // =========================================

    function normalizeAngle(angle) {

        return ((angle % 360) + 360) % 360;

    }


    // =========================================
    // 각도 → 28개 프레임
    // =========================================

    function angleToFrame(angle) {

        angle = normalizeAngle(angle);

        const frameSize =
            360 / FRAME_COUNT;

        let frame =
            Math.round(angle / frameSize);

        frame = frame % FRAME_COUNT;

        return frame;

    }


    // =========================================
    // 프레임 표시
    // =========================================

    function showFrame(frame) {

        /*
         * frame = 0
         * → frame_0001.png
         *
         * frame = 27
         * → frame_0028.png
         */

        const fileNumber =
            String(frame + 1).padStart(4, "0");

        compassImage.src =
            `compass/frame_${fileNumber}.png`;

        frameInfo.textContent =
            `프레임: ${frame + 1} / ${FRAME_COUNT}`;

    }


    // =========================================
    // 나침반 업데이트
    // =========================================

    function updateCompass(heading) {

        heading =
            normalizeAngle(heading);

        currentHeading = heading;

        const frame =
            angleToFrame(heading);

        showFrame(frame);

        directionText.textContent =
            `방향: ${heading.toFixed(1)}°`;

    }


    // =========================================
    // 센서 데이터 표시
    // =========================================

    function showSensorData(event) {

        const alpha =
            event.alpha === null
                ? "없음"
                : event.alpha.toFixed(1);

        const beta =
            event.beta === null
                ? "없음"
                : event.beta.toFixed(1);

        const gamma =
            event.gamma === null
                ? "없음"
                : event.gamma.toFixed(1);

        sensorInfo.innerHTML =
            `alpha: ${alpha}°<br>` +
            `beta: ${beta}°<br>` +
            `gamma: ${gamma}°`;

    }


    // =========================================
    // 방향 센서 이벤트
    // =========================================

    function handleOrientation(event) {

        // 센서값 확인용
        showSensorData(event);


        /*
         * Android의 일반적인 경우
         *
         * alpha는 기기의 회전값을 나타낸다.
         *
         * 우선 센서가 정상적으로 들어오는지
         * 확인하기 위해 alpha를 사용한다.
         */

        if (event.alpha !== null) {

            const heading =
                normalizeAngle(360 - event.alpha);

            updateCompass(heading);

        }

    }


    // =========================================
    // 센서 시작
    // =========================================

    async function startCompass() {

        sensorInfo.textContent =
            "센서 권한 확인 중...";


        /*
         * iOS처럼 명시적인 권한 요청이
         * 필요한 브라우저가 있는 경우
         */

        if (
            typeof DeviceOrientationEvent !== "undefined" &&
            typeof DeviceOrientationEvent.requestPermission === "function"
        ) {

            try {

                const permission =
                    await DeviceOrientationEvent
                        .requestPermission();

                if (permission !== "granted") {

                    sensorInfo.textContent =
                        "센서 권한이 거부되었습니다.";

                    return;

                }

            } catch (error) {

                console.error(error);

                sensorInfo.textContent =
                    "센서 권한 요청 중 오류가 발생했습니다.";

                return;

            }

        }


        /*
         * 방향 센서 이벤트 등록
         */

        window.addEventListener(
            "deviceorientation",
            handleOrientation,
            true
        );


        sensorInfo.textContent =
            "센서 연결됨. 스마트폰을 회전해보세요.";

        startButton.textContent =
            "나침반 작동 중";

        startButton.disabled = true;

    }


    // =========================================
    // 시작 버튼
    // =========================================

    startButton.addEventListener(
        "click",
        startCompass
    );


    // =========================================
    // 초기 화면
    // =========================================

    updateCompass(0);

</script>

</body>
</html>
