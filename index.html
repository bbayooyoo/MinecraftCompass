<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Minecraft Compass</title>


    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        crossorigin=""
    >


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            min-height: 100vh;

            background: #111;
            color: white;

            font-family: Arial, sans-serif;

            display: flex;
            flex-direction: column;
            align-items: center;
        }


        h1 {
            margin: 20px 0;
        }


        #compass {
            width: 160px;
            height: 160px;

            image-rendering: pixelated;
        }


        #direction {
            margin-top: 10px;
            font-size: 20px;
        }


        #frameInfo {
            margin-top: 5px;
            font-size: 14px;
        }


        #map {
            width: 95%;
            height: 400px;

            margin-top: 20px;

            border-radius: 8px;
        }


        #locationInfo,
        #destinationInfo,
        #sensorInfo {

            width: 95%;
            max-width: 600px;

            margin-top: 12px;
            padding: 12px;

            background: #222;

            text-align: center;

            line-height: 1.6;
        }


        #destinationInfo {
            background: #333;
        }


        #sensorInfo {
            font-size: 14px;
        }


        button {
            margin-top: 12px;

            padding: 12px 24px;

            border: none;
            border-radius: 6px;

            font-size: 16px;
        }


        button:disabled {
            opacity: 0.5;
        }

    </style>

</head>


<body>


    <h1>Minecraft Compass</h1>


    <img
        id="compass"
        src="compass/frame_0015.png"
        alt="Minecraft Compass"
    >


    <div id="direction">
        목적지 방향: --°
    </div>


    <div id="frameInfo">
        프레임: 15 / 28
    </div>


    <div id="map"></div>


    <div id="locationInfo">
        현재 위치를 확인하는 중...
    </div>


    <div id="destinationInfo">
        지도를 터치해서 목적지를 선택하세요.
    </div>


    <div id="sensorInfo">
        방향 센서 대기 중...
    </div>


    <button id="startButton">
        나침반 시작
    </button>


    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        crossorigin="">
    </script>


    <script>


        // =========================================
        // 기본 설정
        // =========================================

        const FRAME_COUNT = 28;

        /*
         * Minecraft 나침반에서
         * 15번 프레임을 정면으로 사용
         */
        const FRONT_FRAME = 15;


        /*
         * 센서 heading 보정값
         *
         * 일단 0으로 시작한다.
         *
         * 실제 기기에서 일정하게 어긋나면
         * 이 값만 수정하면 된다.
         */
        const HEADING_OFFSET = 0;


        // =========================================
        // HTML 요소
        // =========================================

        const compassImage =
            document.getElementById("compass");

        const directionText =
            document.getElementById("direction");

        const frameInfo =
            document.getElementById("frameInfo");

        const locationInfo =
            document.getElementById("locationInfo");

        const destinationInfo =
            document.getElementById("destinationInfo");

        const sensorInfo =
            document.getElementById("sensorInfo");

        const startButton =
            document.getElementById("startButton");


        // =========================================
        // GPS 변수
        // =========================================

        let currentLatitude = null;

        let currentLongitude = null;

        let currentMarker = null;

        let locationWatchId = null;


        // =========================================
        // 목적지 변수
        // =========================================

        let destinationLatitude = null;

        let destinationLongitude = null;

        let destinationMarker = null;

        let destinationBearing = null;


        // =========================================
        // 방향 변수
        // =========================================

        let currentHeading = null;

        let orientationSensor = null;


        // =========================================
        // 각도 정규화
        // =========================================

        function normalizeAngle(angle) {

            return (
                (angle % 360) + 360
            ) % 360;

        }


        // =========================================
        // 두 각도의 차이
        //
        // 결과:
        // -180 ~ +180
        //
        // 양수 = 오른쪽
        // 음수 = 왼쪽
        // =========================================

        function angleDifference(
            target,
            current
        ) {

            return (
                normalizeAngle(
                    target - current + 180
                ) - 180
            );

        }


        // =========================================
        // Minecraft 프레임 표시
        // =========================================

        function showFrame(frame) {

            const fileNumber =
                String(frame + 1)
                    .padStart(4, "0");


            compassImage.src =
                `compass/frame_${fileNumber}.png`;


            frameInfo.textContent =
                `프레임: ${frame + 1} / ${FRAME_COUNT}`;

        }


        // =========================================
        // 목적지 방향 → Minecraft 프레임
        // =========================================

        function updateCompass() {

            if (
                destinationBearing === null ||
                currentHeading === null
            ) {

                showFrame(
                    FRONT_FRAME - 1
                );


                directionText.textContent =
                    "목적지 방향: --°";


                return;

            }


            /*
             * 목적지의 절대 방위각
             * -
             * 현재 스마트폰 heading
             *
             * = 스마트폰 기준 목적지 방향
             */

            const relativeAngle =
                angleDifference(
                    destinationBearing,
                    currentHeading
                );


            /*
             * -180~180
             * →
             * 0~360
             */

            const compassAngle =
                normalizeAngle(
                    relativeAngle
                );


            /*
             * 한 프레임당 각도
             */

            const frameSize =
                360 / FRAME_COUNT;


            /*
             * 정면 = 15번 프레임
             *
             * relativeAngle = 0
             * → frame 15
             */

            const offset =
                Math.round(
                    compassAngle / frameSize
                );


            let frame =
                (
                    FRONT_FRAME - 1
                    +
                    offset
                )
                % FRAME_COUNT;


            /*
             * 음수 방지
             */

            if (frame < 0) {

                frame += FRAME_COUNT;

            }


            showFrame(frame);


            directionText.textContent =
                `목적지 방향: ` +
                `${relativeAngle.toFixed(1)}° ` +
                `(${getDirectionText(relativeAngle)})`;

        }


        // =========================================
        // 상대 방향 텍스트
        // =========================================

        function getDirectionText(angle) {

            if (
                Math.abs(angle) < 6.5
            ) {

                return "정면";

            }


            if (
                angle > 0
            ) {

                return "오른쪽";

            }


            return "왼쪽";

        }


        // =========================================
        // 지도 생성
        // =========================================

        const map =
            L.map("map")
                .setView(
                    [
                        37.5665,
                        126.9780
                    ],
                    15
                );


        // =========================================
        // OpenStreetMap
        // =========================================

        L.tileLayer(

            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

            {
                maxZoom: 19,

                attribution:
                    '&copy; OpenStreetMap contributors'
            }

        ).addTo(map);


        // =========================================
        // GPS 성공
        // =========================================

        function handleLocationSuccess(position) {

            currentLatitude =
                position.coords.latitude;


            currentLongitude =
                position.coords.longitude;


            const accuracy =
                position.coords.accuracy;


            // =====================================
            // 현재 위치 마커
            // =====================================

            if (
                currentMarker === null
            ) {

                currentMarker =
                    L.marker(
                        [
                            currentLatitude,
                            currentLongitude
                        ]
                    )
                    .addTo(map);

            }

            else {

                currentMarker.setLatLng(
                    [
                        currentLatitude,
                        currentLongitude
                    ]
                );

            }


            // =====================================
            // 위치 정보
            // =====================================

            locationInfo.innerHTML =
                `현재 위치<br>` +
                `위도: ${currentLatitude.toFixed(6)}<br>` +
                `경도: ${currentLongitude.toFixed(6)}<br>` +
                `정확도: 약 ${accuracy.toFixed(1)} m`;


            /*
             * 처음 위치를 얻었을 때만
             * 지도 중심 이동
             */

            if (
                !map._locationInitialized
            ) {

                map.setView(
                    [
                        currentLatitude,
                        currentLongitude
                    ],
                    17
                );


                map._locationInitialized =
                    true;

            }


            /*
             * 현재 위치가 바뀌었으므로
             * 목적지 방위각도 다시 계산
             */

            if (
                destinationLatitude !== null &&
                destinationLongitude !== null
            ) {

                calculateBearing();

            }

        }


        // =========================================
        // GPS 실패
        // =========================================

        function handleLocationError(error) {

            console.error(error);


            if (
                error.code === 1
            ) {

                locationInfo.textContent =
                    "위치 권한이 거부되었습니다.";

            }

            else if (
                error.code === 2
            ) {

                locationInfo.textContent =
                    "현재 위치를 확인할 수 없습니다.";

            }

            else if (
                error.code === 3
            ) {

                locationInfo.textContent =
                    "위치 확인 시간이 초과되었습니다.";

            }

            else {

                locationInfo.textContent =
                    "위치 정보를 가져올 수 없습니다.";

            }

        }


        // =========================================
        // GPS 실시간 추적
        // =========================================

        function startLocationTracking() {

            if (
                !("geolocation" in navigator)
            ) {

                locationInfo.textContent =
                    "이 브라우저는 GPS를 지원하지 않습니다.";

                return;

            }


            if (
                locationWatchId !== null
            ) {

                return;

            }


            locationWatchId =
                navigator.geolocation.watchPosition(

                    handleLocationSuccess,

                    handleLocationError,

                    {
                        enableHighAccuracy: true,

                        timeout: 10000,

                        maximumAge: 1000
                    }

                );

        }


        // =========================================
        // 목적지 방위각 계산
        // =========================================

        function calculateBearing() {

            if (
                currentLatitude === null ||
                currentLongitude === null
            ) {

                return;

            }


            if (
                destinationLatitude === null ||
                destinationLongitude === null
            ) {

                return;

            }


            const lat1 =
                currentLatitude *
                Math.PI / 180;


            const lat2 =
                destinationLatitude *
                Math.PI / 180;


            const deltaLongitude =
                (
                    destinationLongitude -
                    currentLongitude
                )
                *
                Math.PI / 180;


            const y =
                Math.sin(deltaLongitude) *
                Math.cos(lat2);


            const x =
                Math.cos(lat1) *
                Math.sin(lat2)
                -
                Math.sin(lat1) *
                Math.cos(lat2) *
                Math.cos(deltaLongitude);


            let bearing =
                Math.atan2(y, x)
                *
                180 /
                Math.PI;


            bearing =
                normalizeAngle(bearing);


            destinationBearing =
                bearing;


            destinationInfo.innerHTML =
                `목적지<br>` +
                `위도: ${destinationLatitude.toFixed(6)}<br>` +
                `경도: ${destinationLongitude.toFixed(6)}<br>` +
                `<strong>` +
                `목적지 방위각: ${bearing.toFixed(1)}°` +
                `</strong>`;


            updateCompass();

        }


        // =========================================
        // 지도 클릭
        // =========================================

        map.on(
            "click",
            function(event) {

                destinationLatitude =
                    event.latlng.lat;


                destinationLongitude =
                    event.latlng.lng;


                // =================================
                // 기존 목적지 마커 삭제
                // =================================

                if (
                    destinationMarker !== null
                ) {

                    map.removeLayer(
                        destinationMarker
                    );

                }


                // =================================
                // 새 목적지 마커
                // =================================

                destinationMarker =
                    L.marker(
                        [
                            destinationLatitude,
                            destinationLongitude
                        ]
                    )
                    .addTo(map);


                destinationMarker
                    .bindPopup("목적지")
                    .openPopup();


                calculateBearing();

            }
        );


        // =========================================
        // Quaternion → Heading
        // =========================================

        function quaternionToHeading(
            quaternion
        ) {

            const x =
                quaternion[0];

            const y =
                quaternion[1];

            const z =
                quaternion[2];

            const w =
                quaternion[3];


            /*
             * Quaternion을 yaw로 변환
             */

            const sinYaw =
                2 *
                (
                    w * z +
                    x * y
                );


            const cosYaw =
                1 -
                2 *
                (
                    y * y +
                    z * z
                );


            let heading =
                Math.atan2(
                    sinYaw,
                    cosYaw
                )
                *
                180 /
                Math.PI;


            heading =
                normalizeAngle(heading);


            return heading;

        }


        // =========================================
        // AbsoluteOrientationSensor 시작
        // =========================================

        function startOrientationSensor() {

            if (
                typeof AbsoluteOrientationSensor ===
                "undefined"
            ) {

                sensorInfo.textContent =
                    "AbsoluteOrientationSensor를 " +
                    "지원하지 않는 기기입니다.";

                return false;

            }


            try {

                orientationSensor =
                    new AbsoluteOrientationSensor(
                        {
                            frequency: 30
                        }
                    );


                // =================================
                // 센서 데이터
                // =================================

                orientationSensor.addEventListener(
                    "reading",
                    function() {

                        const quaternion =
                            orientationSensor.quaternion;


                        if (
                            !quaternion
                        ) {

                            return;

                        }


                        /*
                         * Quaternion
                         * →
                         * Heading
                         */

                        let heading =
                            quaternionToHeading(
                                quaternion
                            );


                        /*
                         * 기기/브라우저 오프셋 보정
                         */

                        heading =
                            normalizeAngle(
                                heading +
                                HEADING_OFFSET
                            );


                        currentHeading =
                            heading;


                        // =================================
                        // 센서 정보
                        // =================================

                        sensorInfo.innerHTML =

                            `<strong>` +
                            `현재 heading: ` +
                            `${heading.toFixed(1)}°` +
                            `</strong><br><br>` +

                            `Quaternion<br>` +

                            `x: ` +
                            `${quaternion[0].toFixed(4)}` +
                            `<br>` +

                            `y: ` +
                            `${quaternion[1].toFixed(4)}` +
                            `<br>` +

                            `z: ` +
                            `${quaternion[2].toFixed(4)}` +
                            `<br>` +

                            `w: ` +
                            `${quaternion[3].toFixed(4)}`;


                        /*
                         * heading이 바뀔 때마다
                         * 나침반 즉시 갱신
                         */

                        updateCompass();

                    }
                );


                // =================================
                // 센서 오류
                // =================================

                orientationSensor.addEventListener(
                    "error",
                    function(event) {

                        console.error(
                            event.error
                        );


                        sensorInfo.textContent =
                            "센서 오류: " +
                            event.error.name;

                    }
                );


                orientationSensor.start();


                return true;

            }

            catch (error) {

                console.error(error);


                sensorInfo.textContent =
                    "센서 시작 실패: " +
                    error.name;


                return false;

            }

        }


        // =========================================
        // 나침반 시작
        // =========================================

        function startCompass() {

            sensorInfo.textContent =
                "방향 센서 시작 중...";


            const success =
                startOrientationSensor();


            if (
                !success
            ) {

                return;

            }


            startButton.textContent =
                "나침반 작동 중";


            startButton.disabled =
                true;

        }


        // =========================================
        // 버튼
        // =========================================

        startButton.addEventListener(
            "click",
            startCompass
        );


        // =========================================
        // 초기화
        // =========================================

        showFrame(
            FRONT_FRAME - 1
        );


        startLocationTracking();


    </script>

</body>

</html>
