<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>조영이의 마크 나침반 구현</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        crossorigin=""
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background: #111;
            color: white;

            font-family: Arial, sans-serif;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin: 20px 0;
        }

        #map {
            width: 95%;
            height: 500px;

            border-radius: 8px;
        }

        #locationInfo {
            width: 95%;
            max-width: 600px;

            margin-top: 15px;
            padding: 15px;

            background: #222;

            text-align: center;

            line-height: 1.6;
        }

        button {
            margin-top: 15px;

            padding: 12px 24px;

            border: none;
            border-radius: 6px;

            font-size: 16px;
        }

    </style>

</head>


<body>

    <h1>Minecraft Compass</h1>


    <!-- 지도 -->

    <div id="map"></div>


    <!-- 위치 정보 -->

    <div id="locationInfo">
        현재 위치를 확인하는 중...
    </div>


    <button id="locationButton">
        현재 위치 가져오기
    </button>


    <!-- Leaflet JavaScript -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        crossorigin="">
    </script>


    <script>

        // =========================================
        // 지도 기본 설정
        // =========================================

        // 처음 표시할 임시 위치
        // 서울 좌표를 사용한다.
        // 실제 위치를 가져오면 자동으로 이동한다.

        const initialLatitude = 37.5665;
        const initialLongitude = 126.9780;


        const map = L.map("map").setView(
            [initialLatitude, initialLongitude],
            15
        );


        // =========================================
        // OpenStreetMap 지도 타일
        // =========================================

        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 19,
                attribution:
                    '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
            }
        ).addTo(map);


        // =========================================
        // 현재 위치 마커
        // =========================================

        let currentMarker = null;


        // =========================================
        // 화면 요소
        // =========================================

        const locationInfo =
            document.getElementById("locationInfo");

        const locationButton =
            document.getElementById("locationButton");


        // =========================================
        // 위치 가져오기 성공
        // =========================================

        function handleLocationSuccess(position) {

            const latitude =
                position.coords.latitude;

            const longitude =
                position.coords.longitude;

            const accuracy =
                position.coords.accuracy;


            // 지도 이동

            map.setView(
                [latitude, longitude],
                17
            );


            // 기존 마커가 있으면 삭제

            if (currentMarker !== null) {

                map.removeLayer(currentMarker);

            }


            // 새로운 현재 위치 마커 생성

            currentMarker =
                L.marker(
                    [latitude, longitude]
                ).addTo(map);


            currentMarker.bindPopup(
                "현재 위치"
            ).openPopup();


            // 위치 정보 표시

            locationInfo.innerHTML =
                `위도: ${latitude.toFixed(6)}<br>` +
                `경도: ${longitude.toFixed(6)}<br>` +
                `위치 정확도: 약 ${accuracy.toFixed(1)} m`;


            locationButton.textContent =
                "현재 위치 업데이트";

        }


        // =========================================
        // 위치 가져오기 실패
        // =========================================

        function handleLocationError(error) {

            console.error(error);


            if (error.code === 1) {

                locationInfo.textContent =
                    "위치 권한이 거부되었습니다.";

            }
            else if (error.code === 2) {

                locationInfo.textContent =
                    "현재 위치를 확인할 수 없습니다.";

            }
            else if (error.code === 3) {

                locationInfo.textContent =
                    "위치 확인 시간이 초과되었습니다.";

            }
            else {

                locationInfo.textContent =
                    "위치를 가져오는 중 오류가 발생했습니다.";

            }

        }


        // =========================================
        // GPS 시작
        // =========================================

        function getCurrentLocation() {

            if (!("geolocation" in navigator)) {

                locationInfo.textContent =
                    "이 브라우저는 위치 정보를 지원하지 않습니다.";

                return;

            }


            locationInfo.textContent =
                "현재 위치를 확인하는 중...";


            navigator.geolocation.getCurrentPosition(
                handleLocationSuccess,
                handleLocationError,
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );

        }


        // =========================================
        // 버튼 클릭
        // =========================================

        locationButton.addEventListener(
            "click",
            getCurrentLocation
        );


    </script>

</body>

</html>
