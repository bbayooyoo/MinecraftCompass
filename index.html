<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Minecraft Compass</title>


    <!-- =========================================
         Leaflet CSS
    ========================================== -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        crossorigin=""
    >


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            min-height: 100vh;

            background: #111;
            color: white;

            font-family: Arial, sans-serif;

            display: flex;
            flex-direction: column;
            align-items: center;
        }


        h1 {
            margin: 20px 0;
        }


        /* =========================================
           Minecraft Compass
        ========================================== */

        #compass {
            width: 160px;
            height: 160px;

            image-rendering: pixelated;
        }


        #direction {
            margin-top: 10px;
            font-size: 20px;
        }


        #frameInfo {
            margin-top: 5px;
            font-size: 14px;
        }


        /* =========================================
           지도
        ========================================== */

        #map {
            width: 95%;
            height: 400px;

            margin-top: 20px;

            border-radius: 8px;
        }


        /* =========================================
           정보
        ========================================== */

        #locationInfo,
        #destinationInfo,
        #sensorInfo {

            width: 95%;
            max-width: 600px;

            margin-top: 12px;
            padding: 12px;

            background: #222;

            text-align: center;

            line-height: 1.6;

        }


        #destinationInfo {
            background: #333;
        }


        #sensorInfo {
            font-size: 14px;
        }


        /* =========================================
           버튼
        ========================================== */

        button {

            margin-top: 12px;

            padding: 12px 24px;

            border: none;
            border-radius: 6px;

            font-size: 16px;

        }


        button:disabled {

            opacity: 0.5;

        }

    </style>

</head>


<body>


    <h1>Minecraft Compass</h1>


    <!-- =========================================
         Minecraft 나침반
    ========================================== -->

    <img
        id="compass"
        src="compass/frame_0001.png"
        alt="Minecraft Compass"
    >


    <div id="direction">
        목적지 방향: --°
    </div>


    <div id="frameInfo">
        프레임: 1 / 28
    </div>


    <!-- =========================================
         지도
    ========================================== -->

    <div id="map"></div>


    <!-- =========================================
         현재 위치
    ========================================== -->

    <div id="locationInfo">
        현재 위치를 확인하는 중...
    </div>


    <!-- =========================================
         목적지
    ========================================== -->

    <div id="destinationInfo">
        지도를 터치해서 목적지를 선택하세요.
    </div>


    <!-- =========================================
         센서
    ========================================== -->

    <div id="sensorInfo">
        방향 센서 대기 중...
    </div>


    <!-- =========================================
         버튼
    ========================================== -->

    <button id="locationButton">
        현재 위치 가져오기
    </button>


    <button id="startButton">
        나침반 시작
    </button>


    <!-- =========================================
         Leaflet JavaScript
    ========================================== -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        crossorigin="">
    </script>


    <script>


        // =========================================
        // 기본 설정
        // =========================================

        const FRAME_COUNT = 28;


        // =========================================
        // 화면 요소
        // =========================================

        const compassImage =
            document.getElementById("compass");

        const directionText =
            document.getElementById("direction");

        const frameInfo =
            document.getElementById("frameInfo");

        const locationInfo =
            document.getElementById("locationInfo");

        const destinationInfo =
            document.getElementById("destinationInfo");

        const sensorInfo =
            document.getElementById("sensorInfo");

        const locationButton =
            document.getElementById("locationButton");

        const startButton =
            document.getElementById("startButton");


        // =========================================
        // 현재 위치
        // =========================================

        let currentLatitude = null;
        let currentLongitude = null;

        let currentMarker = null;


        // =========================================
        // 목적지
        // =========================================

        let destinationLatitude = null;
        let destinationLongitude = null;

        let destinationMarker = null;

        let destinationBearing = null;


        // =========================================
        // 스마트폰 방향
        // =========================================

        let currentHeading = null;

        let sensorStarted = false;

        let absoluteHeadingAvailable = false;


        // =========================================
        // 각도 정리
        // =========================================

        function normalizeAngle(angle) {

            return ((angle % 360) + 360) % 360;

        }


        // =========================================
        // 두 각도의 차이
        //
        // 결과:
        // -180 ~ +180
        //
        // + = 오른쪽
        // - = 왼쪽
        // =========================================

        function angleDifference(
            target,
            current
        ) {

            return normalizeAngle(
                target - current + 180
            ) - 180;

        }


        // =========================================
        // 각도 → Minecraft 프레임
        // =========================================

        function angleToFrame(angle) {

            angle =
                normalizeAngle(angle);


            const frameSize =
                360 / FRAME_COUNT;


            let frame =
                Math.round(
                    angle / frameSize
                );


            frame =
                frame % FRAME_COUNT;


            return frame;

        }


        // =========================================
        // Minecraft 프레임 표시
        // =========================================

        function showFrame(frame) {

            const fileNumber =
                String(frame + 1)
                    .padStart(4, "0");


            compassImage.src =
                `compass/frame_${fileNumber}.png`;


            frameInfo.textContent =
                `프레임: ${frame + 1} / ${FRAME_COUNT}`;

        }


        // =========================================
        // 상대 방향 → Minecraft 나침반
        // =========================================

        function updateCompass() {

            if (
                destinationBearing === null ||
                currentHeading === null
            ) {

                directionText.textContent =
                    "목적지 방향: --°";

                return;

            }


            /*
             * 목적지의 절대 방위각에서
             * 현재 스마트폰의 방위각을 뺀다.
             */

            const relativeAngle =
                angleDifference(
                    destinationBearing,
                    currentHeading
                );


            /*
             * Minecraft 나침반 프레임은
             * 0~360 범위로 변환해서 사용한다.
             */

            const compassAngle =
                normalizeAngle(relativeAngle);


            const frame =
                angleToFrame(compassAngle);


            showFrame(frame);


            directionText.textContent =
                `목적지 방향: ` +
                `${relativeAngle.toFixed(1)}° ` +
                `(${relativeDirectionText(relativeAngle)})`;

        }


        // =========================================
        // 상대 방향 글자
        // =========================================

        function relativeDirectionText(angle) {

            if (Math.abs(angle) < 5) {

                return "정면";

            }


            if (angle > 0) {

                return "오른쪽";

            }


            return "왼쪽";

        }


        // =========================================
        // Leaflet 지도
        // =========================================

        const initialLatitude =
            37.5665;

        const initialLongitude =
            126.9780;


        const map =
            L.map("map")
             .setView(
                 [
                     initialLatitude,
                     initialLongitude
                 ],
                 15
             );


        // =========================================
        // OpenStreetMap
        // =========================================

        L.tileLayer(

            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

            {

                maxZoom: 19,

                attribution:
                    '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'

            }

        ).addTo(map);


        // =========================================
        // 현재 위치 성공
        // =========================================

        function handleLocationSuccess(position) {

            currentLatitude =
                position.coords.latitude;

            currentLongitude =
                position.coords.longitude;


            const accuracy =
                position.coords.accuracy;


            // 지도 이동

            map.setView(

                [
                    currentLatitude,
                    currentLongitude
                ],

                17

            );


            // 기존 마커 삭제

            if (currentMarker !== null) {

                map.removeLayer(
                    currentMarker
                );

            }


            // 현재 위치 마커 생성

            currentMarker =
                L.marker(

                    [
                        currentLatitude,
                        currentLongitude
                    ]

                )
                .addTo(map);


            currentMarker
                .bindPopup("현재 위치")
                .openPopup();


            // 정보 표시

            locationInfo.innerHTML =

                `현재 위치<br>` +

                `위도: ` +
                `${currentLatitude.toFixed(6)}<br>` +

                `경도: ` +
                `${currentLongitude.toFixed(6)}<br>` +

                `위치 정확도: ` +
                `약 ${accuracy.toFixed(1)} m`;


            locationButton.textContent =
                "현재 위치 업데이트";


            // 목적지가 이미 있으면
            // 방위각 다시 계산

            if (
                destinationLatitude !== null &&
                destinationLongitude !== null
            ) {

                calculateBearing();

            }

        }


        // =========================================
        // 위치 실패
        // =========================================

        function handleLocationError(error) {

            console.error(error);


            if (error.code === 1) {

                locationInfo.textContent =
                    "위치 권한이 거부되었습니다.";

            }

            else if (error.code === 2) {

                locationInfo.textContent =
                    "현재 위치를 확인할 수 없습니다.";

            }

            else if (error.code === 3) {

                locationInfo.textContent =
                    "위치 확인 시간이 초과되었습니다.";

            }

            else {

                locationInfo.textContent =
                    "위치를 가져오는 중 오류가 발생했습니다.";

            }

        }


        // =========================================
        // GPS 시작
        // =========================================

        function getCurrentLocation() {

            if (
                !("geolocation" in navigator)
            ) {

                locationInfo.textContent =
                    "이 브라우저는 위치 정보를 지원하지 않습니다.";

                return;

            }


            locationInfo.textContent =
                "현재 위치를 확인하는 중...";


            navigator.geolocation.getCurrentPosition(

                handleLocationSuccess,

                handleLocationError,

                {

                    enableHighAccuracy: true,

                    timeout: 10000,

                    maximumAge: 0

                }

            );

        }


        // =========================================
        // 목적지 방위각 계산
        // =========================================

        function calculateBearing() {

            if (
                currentLatitude === null ||
                currentLongitude === null
            ) {

                destinationInfo.textContent =
                    "현재 위치를 먼저 가져와 주세요.";

                return;

            }


            if (
                destinationLatitude === null ||
                destinationLongitude === null
            ) {

                return;

            }


            // 현재 위치 위도 → 라디안

            const lat1 =
                currentLatitude *
                Math.PI / 180;


            // 목적지 위도 → 라디안

            const lat2 =
                destinationLatitude *
                Math.PI / 180;


            // 경도 차이 → 라디안

            const deltaLongitude =
                (
                    destinationLongitude -
                    currentLongitude
                )
                * Math.PI / 180;


            // 방위각 계산

            const y =
                Math.sin(deltaLongitude) *
                Math.cos(lat2);


            const x =
                Math.cos(lat1) *
                Math.sin(lat2)
                -
                Math.sin(lat1) *
                Math.cos(lat2) *
                Math.cos(deltaLongitude);


            let bearing =
                Math.atan2(y, x)
                * 180 / Math.PI;


            bearing =
                normalizeAngle(bearing);


            destinationBearing =
                bearing;


            // 목적지 정보 표시

            destinationInfo.innerHTML =

                `목적지<br>` +

                `위도: ` +
                `${destinationLatitude.toFixed(6)}<br>` +

                `경도: ` +
                `${destinationLongitude.toFixed(6)}<br>` +

                `<strong>` +
                `목적지 방위각: ` +
                `${bearing.toFixed(1)}°` +
                `</strong>`;


            // 나침반 업데이트

            updateCompass();

        }


        // =========================================
        // 지도 클릭
        // =========================================

        map.on(

            "click",

            function(event) {

                destinationLatitude =
                    event.latlng.lat;

                destinationLongitude =
                    event.latlng.lng;


                // 기존 목적지 마커 삭제

                if (
                    destinationMarker !== null
                ) {

                    map.removeLayer(
                        destinationMarker
                    );

                }


                // 목적지 마커 생성

                destinationMarker =
                    L.marker(

                        [
                            destinationLatitude,
                            destinationLongitude
                        ]

                    )
                    .addTo(map);


                destinationMarker
                    .bindPopup("목적지")
                    .openPopup();


                // 방위각 계산

                calculateBearing();

            }

        );


        // =========================================
        // DeviceOrientation 처리
        // =========================================

        function handleOrientation(event) {

            /*
             * absolute가 true이면
             * 지구 좌표계 기준 방향 정보를
             * 사용할 수 있다고 판단한다.
             */

            if (event.absolute === true) {

                absoluteHeadingAvailable =
                    true;

            }


            if (event.alpha === null) {

                sensorInfo.textContent =
                    "alpha 센서값을 받을 수 없습니다.";

                return;

            }


            /*
             * 일반적인 DeviceOrientation의
             * alpha 방향을 방위각 형태로 변환한다.
             *
             * alpha가 시계 반대 방향으로 증가하는
             * 좌표계를 보정한다.
             */

            let heading =
                normalizeAngle(
                    360 - event.alpha
                );


            currentHeading =
                heading;

            

            const compassHeading =
                event.webkitCompassHeading;

            sensorInfo.innerHTML =

                `alpha: ${event.alpha.toFixed(1)}°<br>` +

                `beta: ${
                    event.beta === null
                        ? "없음"
                        : event.beta.toFixed(1)
                }°<br>` +

                `gamma: ${
                    event.gamma === null
                        ? "없음"
                        : event.gamma.toFixed(1)
                }°<br>` +

                `absolute: ${event.absolute}<br>` +

                `webkitCompassHeading: ${
                    compassHeading === undefined
                        ? "없음"
                        : compassHeading.toFixed(1) + "°"
                }`;


            // 나침반 업데이트

            updateCompass();

        }


        // =========================================
        // 절대 방향 이벤트
        // =========================================

        function handleAbsoluteOrientation(event) {

            if (event.alpha === null) {

                return;

            }


            absoluteHeadingAvailable =
                true;


            /*
             * 절대 방향 이벤트에서도
             * alpha를 방위각 형태로 변환한다.
             */

            const heading =
                normalizeAngle(
                    360 - event.alpha
                );


            currentHeading =
                heading;


            sensorInfo.innerHTML =

                `현재 heading: ` +
                `${heading.toFixed(1)}°<br>` +

                `alpha: ` +
                `${event.alpha.toFixed(1)}°<br>` +

                `beta: ` +
                `${event.beta === null
                    ? "없음"
                    : event.beta.toFixed(1)}°<br>` +

                `gamma: ` +
                `${event.gamma === null
                    ? "없음"
                    : event.gamma.toFixed(1)}°<br>` +

                `absolute: true`;


            updateCompass();

        }


        // =========================================
        // 센서 시작
        // =========================================

        async function startCompass() {

            sensorInfo.textContent =
                "방향 센서를 시작하는 중...";


            /*
             * iOS 등 일부 브라우저에서는
             * 사용자 동작으로 권한을 요청해야 한다.
             */

            if (

                typeof DeviceOrientationEvent !==
                "undefined"

                &&

                typeof DeviceOrientationEvent
                    .requestPermission ===
                    "function"

            ) {

                try {

                    const permission =

                        await
                        DeviceOrientationEvent
                            .requestPermission();


                    if (
                        permission !== "granted"
                    ) {

                        sensorInfo.textContent =
                            "방향 센서 권한이 거부되었습니다.";

                        return;

                    }

                }

                catch (error) {

                    console.error(error);

                    sensorInfo.textContent =
                        "방향 센서 권한 요청 중 오류가 발생했습니다.";

                    return;

                }

            }


            /*
             * 일반 방향 이벤트
             */

            window.addEventListener(

                "deviceorientation",

                handleOrientation,

                true

            );


            /*
             * 절대 방향 이벤트
             *
             * 브라우저가 지원하는 경우
             * 이 이벤트도 함께 사용한다.
             */

            window.addEventListener(

                "deviceorientationabsolute",

                handleAbsoluteOrientation,

                true

            );


            sensorStarted =
                true;


            startButton.textContent =
                "나침반 작동 중";


            startButton.disabled =
                true;


            sensorInfo.textContent =
                "방향 센서 연결됨.";

        }


        // =========================================
        // 버튼
        // =========================================

        locationButton.addEventListener(

            "click",

            getCurrentLocation

        );


        startButton.addEventListener(

            "click",

            startCompass

        );


        // =========================================
        // 시작
        // =========================================

        getCurrentLocation();

        showFrame(0);


    </script>


</body>

</html>
