<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Minecraft Compass</title>


    <!-- =========================================
         Leaflet CSS
    ========================================== -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        crossorigin=""
    >


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            min-height: 100vh;

            background: #111;
            color: white;

            font-family: Arial, sans-serif;

            display: flex;
            flex-direction: column;
            align-items: center;
        }


        h1 {
            margin: 20px 0;
        }


        /* =========================================
           Minecraft Compass
        ========================================== */

        #compass {
            width: 160px;
            height: 160px;

            image-rendering: pixelated;
        }


        #direction {
            margin-top: 10px;
            font-size: 20px;
        }


        #frameInfo {
            margin-top: 5px;
            font-size: 14px;
        }


        /* =========================================
           지도
        ========================================== */

        #map {
            width: 95%;
            height: 400px;

            margin-top: 20px;

            border-radius: 8px;
        }


        /* =========================================
           정보
        ========================================== */

        #locationInfo,
        #destinationInfo,
        #sensorInfo {

            width: 95%;
            max-width: 600px;

            margin-top: 12px;
            padding: 12px;

            background: #222;

            text-align: center;

            line-height: 1.6;

        }


        #destinationInfo {
            background: #333;
        }


        #sensorInfo {
            font-size: 14px;
        }


        /* =========================================
           버튼
        ========================================== */

        button {

            margin-top: 12px;

            padding: 12px 24px;

            border: none;
            border-radius: 6px;

            font-size: 16px;

        }


        button:disabled {

            opacity: 0.5;

        }

    </style>

</head>


<body>


    <h1>Minecraft Compass</h1>


    <!-- =========================================
         Minecraft 나침반
    ========================================== -->

    <img
        id="compass"
        src="compass/frame_0015.png"
        alt="Minecraft Compass"
    >


    <div id="direction">
        목적지 방향: --°
    </div>


    <div id="frameInfo">
        프레임: 15 / 28
    </div>


    <!-- =========================================
         지도
    ========================================== -->

    <div id="map"></div>


    <!-- =========================================
         현재 위치
    ========================================== -->

    <div id="locationInfo">
        현재 위치를 확인하는 중...
    </div>


    <!-- =========================================
         목적지
    ========================================== -->

    <div id="destinationInfo">
        지도를 터치해서 목적지를 선택하세요.
    </div>


    <!-- =========================================
         센서
    ========================================== -->

    <div id="sensorInfo">
        방향 센서 대기 중...
    </div>


    <!-- =========================================
         버튼
    ========================================== -->

    <button id="locationButton">
        현재 위치 가져오기
    </button>


    <button id="startButton">
        나침반 시작
    </button>


    <!-- =========================================
         Leaflet JavaScript
    ========================================== -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        crossorigin="">
    </script>


    <script>


        // =========================================
        // 기본 설정
        // =========================================

        const FRAME_COUNT = 28;

        const FRONT_FRAME = 15;


        // =========================================
        // 화면 요소
        // =========================================

        const compassImage =
            document.getElementById("compass");

        const directionText =
            document.getElementById("direction");

        const frameInfo =
            document.getElementById("frameInfo");

        const locationInfo =
            document.getElementById("locationInfo");

        const destinationInfo =
            document.getElementById("destinationInfo");

        const sensorInfo =
            document.getElementById("sensorInfo");

        const locationButton =
            document.getElementById("locationButton");

        const startButton =
            document.getElementById("startButton");


        // =========================================
        // 현재 위치
        // =========================================

        let currentLatitude = null;
        let currentLongitude = null;

        let currentMarker = null;


        // =========================================
        // 목적지
        // =========================================

        let destinationLatitude = null;
        let destinationLongitude = null;

        let destinationMarker = null;

        let destinationBearing = null;


        // =========================================
        // 스마트폰 방향
        // =========================================

        let currentHeading = null;

        let sensorStarted = false;


        // =========================================
        // 각도 정리
        // =========================================

        function normalizeAngle(angle) {

            return ((angle % 360) + 360) % 360;

        }


        // =========================================
        // 두 각도의 차이
        // =========================================

        function angleDifference(
            target,
            current
        ) {

            return normalizeAngle(
                target - current + 180
            ) - 180;

        }


        // =========================================
        // Leaflet 지도
        // =========================================

        const map =
            L.map("map")
             .setView(
                 [
                     37.5665,
                     126.9780
                 ],
                 15
             );


        // =========================================
        // OpenStreetMap
        // =========================================

        L.tileLayer(

            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

            {

                maxZoom: 19,

                attribution:
                    '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'

            }

        ).addTo(map);


        // =========================================
        // 현재 위치 성공
        // =========================================

        function handleLocationSuccess(position) {

            currentLatitude =
                position.coords.latitude;

            currentLongitude =
                position.coords.longitude;


            const accuracy =
                position.coords.accuracy;


            map.setView(

                [
                    currentLatitude,
                    currentLongitude
                ],

                17

            );


            if (currentMarker !== null) {

                map.removeLayer(
                    currentMarker
                );

            }


            currentMarker =
                L.marker(

                    [
                        currentLatitude,
                        currentLongitude
                    ]

                )
                .addTo(map);


            currentMarker
                .bindPopup("현재 위치")
                .openPopup();


            locationInfo.innerHTML =

                `현재 위치<br>` +

                `위도: ` +
                `${currentLatitude.toFixed(6)}<br>` +

                `경도: ` +
                `${currentLongitude.toFixed(6)}<br>` +

                `위치 정확도: ` +
                `약 ${accuracy.toFixed(1)} m`;


            locationButton.textContent =
                "현재 위치 업데이트";


            if (
                destinationLatitude !== null &&
                destinationLongitude !== null
            ) {

                calculateBearing();

            }

        }


        // =========================================
        // 위치 실패
        // =========================================

        function handleLocationError(error) {

            console.error(error);


            if (error.code === 1) {

                locationInfo.textContent =
                    "위치 권한이 거부되었습니다.";

            }

            else if (error.code === 2) {

                locationInfo.textContent =
                    "현재 위치를 확인할 수 없습니다.";

            }

            else if (error.code === 3) {

                locationInfo.textContent =
                    "위치 확인 시간이 초과되었습니다.";

            }

            else {

                locationInfo.textContent =
                    "위치를 가져오는 중 오류가 발생했습니다.";

            }

        }


        // =========================================
        // GPS 시작
        // =========================================

        function getCurrentLocation() {

            if (
                !("geolocation" in navigator)
            ) {

                locationInfo.textContent =
                    "이 브라우저는 위치 정보를 지원하지 않습니다.";

                return;

            }


            locationInfo.textContent =
                "현재 위치를 확인하는 중...";


            navigator.geolocation.getCurrentPosition(

                handleLocationSuccess,

                handleLocationError,

                {

                    enableHighAccuracy: true,

                    timeout: 10000,

                    maximumAge: 0

                }

            );

        }


        // =========================================
        // 목적지 방위각 계산
        // =========================================

        function calculateBearing() {

            if (
                currentLatitude === null ||
                currentLongitude === null
            ) {

                destinationInfo.textContent =
                    "현재 위치를 먼저 가져와 주세요.";

                return;

            }


            if (
                destinationLatitude === null ||
                destinationLongitude === null
            ) {

                return;

            }


            const lat1 =
                currentLatitude *
                Math.PI / 180;


            const lat2 =
                destinationLatitude *
                Math.PI / 180;


            const deltaLongitude =
                (
                    destinationLongitude -
                    currentLongitude
                )
                *
                Math.PI / 180;


            const y =
                Math.sin(deltaLongitude) *
                Math.cos(lat2);


            const x =
                Math.cos(lat1) *
                Math.sin(lat2)
                -
                Math.sin(lat1) *
                Math.cos(lat2) *
                Math.cos(deltaLongitude);


            let bearing =
                Math.atan2(y, x)
                *
                180 / Math.PI;


            bearing =
                normalizeAngle(bearing);


            destinationBearing =
                bearing;


            destinationInfo.innerHTML =

                `목적지<br>` +

                `위도: ` +
                `${destinationLatitude.toFixed(6)}<br>` +

                `경도: ` +
                `${destinationLongitude.toFixed(6)}<br>` +

                `<strong>` +
                `목적지 방위각: ` +
                `${bearing.toFixed(1)}°` +
                `</strong>`;


            updateCompass();

        }


        // =========================================
        // 지도 클릭
        // =========================================

        map.on(

            "click",

            function(event) {

                destinationLatitude =
                    event.latlng.lat;

                destinationLongitude =
                    event.latlng.lng;


                if (
                    destinationMarker !== null
                ) {

                    map.removeLayer(
                        destinationMarker
                    );

                }


                destinationMarker =
                    L.marker(

                        [
                            destinationLatitude,
                            destinationLongitude
                        ]

                    )
                    .addTo(map);


                destinationMarker
                    .bindPopup("목적지")
                    .openPopup();


                calculateBearing();

            }

        );


        // =========================================
        // Minecraft 프레임 표시
        // =========================================

        function showFrame(frame) {

            const fileNumber =
                String(frame + 1)
                    .padStart(4, "0");


            compassImage.src =
                `compass/frame_${fileNumber}.png`;


            frameInfo.textContent =
                `프레임: ${frame + 1} / ${FRAME_COUNT}`;

        }


        // =========================================
        // 상대 방향 → 프레임
        // =========================================

        function updateCompass() {

            if (
                destinationBearing === null ||
                currentHeading === null
            ) {

                showFrame(
                    FRONT_FRAME - 1
                );

                directionText.textContent =
                    "목적지 방향: --°";

                return;

            }


            const relativeAngle =
                angleDifference(
                    destinationBearing,
                    currentHeading
                );


            const compassAngle =
                normalizeAngle(
                    relativeAngle
                );


            /*
             * 15번 프레임이 정면.
             *
             * 따라서 0°일 때
             * frame 15를 표시한다.
             */

            const frameSize =
                360 / FRAME_COUNT;


            const frameOffset =
                Math.round(
                    compassAngle /
                    frameSize
                );


            let frame =
                (FRONT_FRAME - 1)
                +
                frameOffset;


            frame =
                ((frame % FRAME_COUNT)
                + FRAME_COUNT)
                % FRAME_COUNT;


            showFrame(frame);


            directionText.textContent =

                `목적지 방향: ` +
                `${relativeAngle.toFixed(1)}° ` +
                `(${relativeDirectionText(relativeAngle)})`;

        }


        // =========================================
        // 상대 방향 글자
        // =========================================

        function relativeDirectionText(angle) {

            if (
                Math.abs(angle) < 5
            ) {

                return "정면";

            }


            if (angle > 0) {

                return "오른쪽";

            }


            return "왼쪽";

        }


        // =========================================
        // 일반 DeviceOrientation
        // =========================================

        function handleOrientation(event) {

            if (
                event.alpha === null
            ) {

                sensorInfo.textContent =
                    "alpha 센서값을 받을 수 없습니다.";

                return;

            }


            const heading =
                normalizeAngle(
                    360 - event.alpha
                );


            currentHeading =
                heading;


            const compassHeading =
                event.webkitCompassHeading;


            sensorInfo.innerHTML =

                `alpha: ${event.alpha.toFixed(1)}°<br>` +

                `beta: ${
                    event.beta === null
                        ? "없음"
                        : event.beta.toFixed(1)
                }°<br>` +

                `gamma: ${
                    event.gamma === null
                        ? "없음"
                        : event.gamma.toFixed(1)
                }°<br>` +

                `absolute: ${event.absolute}<br>` +

                `webkitCompassHeading: ${
                    compassHeading === undefined
                        ? "없음"
                        : compassHeading.toFixed(1) + "°"
                }`;


            updateCompass();

        }


        // =========================================
        // AbsoluteOrientationSensor 테스트
        // =========================================

        function startAbsoluteSensor() {

            if (
                typeof AbsoluteOrientationSensor ===
                "undefined"
            ) {

                sensorInfo.textContent =
                    "AbsoluteOrientationSensor: 지원되지 않음";

                return false;

            }


            try {

                const sensor =
                    new AbsoluteOrientationSensor({

                        frequency: 30

                    });


                sensor.addEventListener(

                    "reading",

                    function() {

                        const quaternion =
                            sensor.quaternion;


                        if (
                            !quaternion
                        ) {

                            return;

                        }


                        sensorInfo.innerHTML =

                            `AbsoluteOrientationSensor 작동 중<br>` +

                            `Quaternion<br>` +

                            `x: ${quaternion[0].toFixed(4)}<br>` +

                            `y: ${quaternion[1].toFixed(4)}<br>` +

                            `z: ${quaternion[2].toFixed(4)}<br>` +

                            `w: ${quaternion[3].toFixed(4)}`;

                    }

                );


                sensor.addEventListener(

                    "error",

                    function(event) {

                        console.error(
                            event.error
                        );


                        sensorInfo.textContent =
                            "센서 오류: " +
                            event.error.name;

                    }

                );


                sensor.start();


                return true;

            }

            catch (error) {

                console.error(error);


                sensorInfo.textContent =
                    "센서 시작 실패: " +
                    error.name;


                return false;

            }

        }


        // =========================================
        // 센서 시작
        // =========================================

        async function startCompass() {

            sensorInfo.textContent =
                "방향 센서를 시작하는 중...";


            /*
             * 일반 DeviceOrientation 등록
             */

            window.addEventListener(

                "deviceorientation",

                handleOrientation,

                true

            );


            /*
             * AbsoluteOrientationSensor 테스트
             */

            const absoluteSensorStarted =
                startAbsoluteSensor();


            sensorStarted =
                true;


            startButton.textContent =
                "나침반 작동 중";


            startButton.disabled =
                true;


            if (
                absoluteSensorStarted
            ) {

                sensorInfo.textContent =
                    "AbsoluteOrientationSensor 시작됨. 센서값 대기 중...";

            }

            else {

                sensorInfo.textContent =
                    "일반 방향 센서 작동 중.";

            }

        }


        // =========================================
        // 버튼
        // =========================================

        locationButton.addEventListener(

            "click",

            getCurrentLocation

        );


        startButton.addEventListener(

            "click",

            startCompass

        );


        // =========================================
        // 초기 화면
        // =========================================

        showFrame(
            FRONT_FRAME - 1
        );


        // =========================================
        // 페이지가 열리면 GPS 시작
        // =========================================

        getCurrentLocation();


    </script>


</body>

</html>
