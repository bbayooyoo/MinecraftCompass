<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Minecraft Compass</title>


    <!-- =========================================
         Leaflet CSS
    ========================================== -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        crossorigin=""
    >


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            min-height: 100vh;

            background: #111;
            color: white;

            font-family: Arial, sans-serif;

            display: flex;
            flex-direction: column;
            align-items: center;
        }


        h1 {
            margin: 20px 0;
        }


        /* =========================================
           Minecraft Compass
        ========================================== */

        #compass {
            width: 160px;
            height: 160px;

            image-rendering: pixelated;
        }


        #direction {
            margin-top: 10px;
            font-size: 20px;
        }


        #frameInfo {
            margin-top: 5px;
            font-size: 14px;
        }


        /* =========================================
           지도
        ========================================== */

        #map {
            width: 95%;
            height: 400px;

            margin-top: 20px;

            border-radius: 8px;
        }


        /* =========================================
           정보
        ========================================== */

        #locationInfo,
        #destinationInfo,
        #sensorInfo {

            width: 95%;
            max-width: 600px;

            margin-top: 12px;
            padding: 12px;

            background: #222;

            text-align: center;

            line-height: 1.6;

        }


        #destinationInfo {
            background: #333;
        }


        #sensorInfo {
            font-size: 14px;
        }


        /* =========================================
           버튼
        ========================================== */

        button {

            margin-top: 12px;

            padding: 12px 24px;

            border: none;
            border-radius: 6px;

            font-size: 16px;

        }


        button:disabled {

            opacity: 0.5;

        }

    </style>

</head>


<body>


    <h1>Minecraft Compass</h1>


    <!-- =========================================
         Minecraft 나침반
    ========================================== -->

    <img
        id="compass"
        src="compass/frame_0015.png"
        alt="Minecraft Compass"
    >


    <div id="direction">
        목적지 방향: --°
    </div>


    <div id="frameInfo">
        프레임: 15 / 28
    </div>


    <!-- =========================================
         지도
    ========================================== -->

    <div id="map"></div>


    <!-- =========================================
         현재 위치
    ========================================== -->

    <div id="locationInfo">
        현재 위치를 확인하는 중...
    </div>


    <!-- =========================================
         목적지
    ========================================== -->

    <div id="destinationInfo">
        지도를 터치해서 목적지를 선택하세요.
    </div>


    <!-- =========================================
         방향 센서
    ========================================== -->

    <div id="sensorInfo">
        방향 센서 대기 중...
    </div>


    <!-- =========================================
         버튼
    ========================================== -->

    <button id="locationButton">
        현재 위치 추적 중
    </button>


    <button id="startButton">
        나침반 시작
    </button>


    <!-- =========================================
         Leaflet JavaScript
    ========================================== -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        crossorigin="">
    </script>


    <script>


        // =========================================
        // 기본 설정
        // =========================================

        const FRAME_COUNT = 28;

        /*
         * Minecraft 이미지에서
         * 15번 프레임을 정면으로 사용한다.
         */

        const FRONT_FRAME = 15;


        // =========================================
        // 화면 요소
        // =========================================

        const compassImage =
            document.getElementById("compass");

        const directionText =
            document.getElementById("direction");

        const frameInfo =
            document.getElementById("frameInfo");

        const locationInfo =
            document.getElementById("locationInfo");

        const destinationInfo =
            document.getElementById("destinationInfo");

        const sensorInfo =
            document.getElementById("sensorInfo");

        const locationButton =
            document.getElementById("locationButton");

        const startButton =
            document.getElementById("startButton");


        // =========================================
        // 현재 위치
        // =========================================

        let currentLatitude = null;

        let currentLongitude = null;

        let currentAccuracy = null;

        let currentMarker = null;

        let locationWatchId = null;


        // =========================================
        // 목적지
        // =========================================

        let destinationLatitude = null;

        let destinationLongitude = null;

        let destinationMarker = null;

        let destinationBearing = null;


        // =========================================
        // 현재 스마트폰 heading
        // =========================================

        let currentHeading = null;

        let sensorStarted = false;

        let orientationSensor = null;


        // =========================================
        // 각도 정리
        // =========================================

        function normalizeAngle(angle) {

            return ((angle % 360) + 360) % 360;

        }


        // =========================================
        // 두 각도의 차이
        //
        // 결과:
        // -180 ~ +180
        //
        // + = 오른쪽
        // - = 왼쪽
        // =========================================

        function angleDifference(
            target,
            current
        ) {

            return normalizeAngle(
                target - current + 180
            ) - 180;

        }


        // =========================================
        // 각도 → Minecraft 프레임
        // =========================================

        function angleToFrame(angle) {

            angle =
                normalizeAngle(angle);


            const frameSize =
                360 / FRAME_COUNT;


            let frame =
                Math.round(
                    angle / frameSize
                );


            frame =
                frame % FRAME_COUNT;


            return frame;

        }


        // =========================================
        // Minecraft 프레임 표시
        // =========================================

        function showFrame(frame) {

            const fileNumber =
                String(frame + 1)
                    .padStart(4, "0");


            compassImage.src =
                `compass/frame_${fileNumber}.png`;


            frameInfo.textContent =
                `프레임: ${frame + 1} / ${FRAME_COUNT}`;

        }


        // =========================================
        // 목적지 상대방향 → Minecraft 프레임
        // =========================================

        function updateCompass() {

            /*
             * 목적지가 없거나
             * heading을 아직 얻지 못한 경우
             */

            if (
                destinationBearing === null ||
                currentHeading === null
            ) {

                showFrame(
                    FRONT_FRAME - 1
                );


                directionText.textContent =
                    "목적지 방향: --°";


                return;

            }


            /*
             * 목적지의 절대 방위각
             * -
             * 현재 스마트폰의 절대 heading
             *
             * = 스마트폰 기준 목적지 방향
             */

            const relativeAngle =
                angleDifference(
                    destinationBearing,
                    currentHeading
                );


            /*
             * -180~180을
             * 0~360으로 변환
             */

            const compassAngle =
                normalizeAngle(
                    relativeAngle
                );


            /*
             * 0°가 정면이 되도록
             * Minecraft 프레임을 이동한다.
             *
             * FRONT_FRAME = 15
             */

            const frameSize =
                360 / FRAME_COUNT;


            const frameOffset =
                Math.round(
                    compassAngle /
                    frameSize
                );


            let frame =
                (FRONT_FRAME - 1)
                +
                frameOffset;


            frame =
                (
                    frame % FRAME_COUNT
                    +
                    FRAME_COUNT
                )
                %
                FRAME_COUNT;


            showFrame(frame);


            directionText.textContent =

                `목적지 방향: ` +
                `${relativeAngle.toFixed(1)}° ` +
                `(${relativeDirectionText(relativeAngle)})`;

        }


        // =========================================
        // 상대 방향 글자
        // =========================================

        function relativeDirectionText(angle) {

            if (
                Math.abs(angle) < 5
            ) {

                return "정면";

            }


            if (angle > 0) {

                return "오른쪽";

            }


            return "왼쪽";

        }


        // =========================================
        // Leaflet 지도
        // =========================================

        const initialLatitude =
            37.5665;

        const initialLongitude =
            126.9780;


        const map =
            L.map("map")
             .setView(

                 [
                     initialLatitude,
                     initialLongitude
                 ],

                 15

             );


        // =========================================
        // OpenStreetMap
        // =========================================

        L.tileLayer(

            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

            {

                maxZoom: 19,

                attribution:
                    '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'

            }

        ).addTo(map);


        // =========================================
        // 현재 위치 성공
        // =========================================

        function handleLocationSuccess(position) {

            currentLatitude =
                position.coords.latitude;


            currentLongitude =
                position.coords.longitude;


            currentAccuracy =
                position.coords.accuracy;


            // =====================================
            // 현재 위치 마커
            // =====================================

            if (
                currentMarker === null
            ) {

                currentMarker =
                    L.marker(

                        [

                            currentLatitude,
                            currentLongitude

                        ]

                    )
                    .addTo(map);


                currentMarker
                    .bindPopup("현재 위치");

            }

            else {

                currentMarker.setLatLng(

                    [

                        currentLatitude,
                        currentLongitude

                    ]

                );

            }


            // =====================================
            // 지도 이동
            // =====================================

            map.setView(

                [

                    currentLatitude,
                    currentLongitude

                ],

                map.getZoom()

            );


            // =====================================
            // 위치 정보
            // =====================================

            locationInfo.innerHTML =

                `현재 위치<br>` +

                `위도: ` +
                `${currentLatitude.toFixed(6)}<br>` +

                `경도: ` +
                `${currentLongitude.toFixed(6)}<br>` +

                `위치 정확도: ` +
                `약 ${currentAccuracy.toFixed(1)} m`;


            // =====================================
            // 목적지가 있으면
            // 방위각 다시 계산
            // =====================================

            if (

                destinationLatitude !== null &&
                destinationLongitude !== null

            ) {

                calculateBearing();

            }

        }


        // =========================================
        // 위치 실패
        // =========================================

        function handleLocationError(error) {

            console.error(error);


            if (
                error.code === 1
            ) {

                locationInfo.textContent =
                    "위치 권한이 거부되었습니다.";

            }

            else if (
                error.code === 2
            ) {

                locationInfo.textContent =
                    "현재 위치를 확인할 수 없습니다.";

            }

            else if (
                error.code === 3
            ) {

                locationInfo.textContent =
                    "위치 확인 시간이 초과되었습니다.";

            }

            else {

                locationInfo.textContent =
                    "위치를 가져오는 중 오류가 발생했습니다.";

            }

        }


        // =========================================
        // 실시간 GPS 위치 추적
        // =========================================

        function startLocationTracking() {

            if (
                !("geolocation" in navigator)
            ) {

                locationInfo.textContent =
                    "이 브라우저는 위치 정보를 지원하지 않습니다.";

                return;

            }


            if (
                locationWatchId !== null
            ) {

                return;

            }


            locationInfo.textContent =
                "현재 위치를 확인하는 중...";


            locationWatchId =
                navigator.geolocation.watchPosition(

                    handleLocationSuccess,

                    handleLocationError,

                    {

                        enableHighAccuracy: true,

                        timeout: 10000,

                        maximumAge: 1000

                    }

                );


            locationButton.textContent =
                "현재 위치 추적 중";

        }


        // =========================================
        // 목적지 방위각 계산
        // =========================================

        function calculateBearing() {

            if (
                currentLatitude === null ||
                currentLongitude === null
            ) {

                destinationInfo.textContent =
                    "현재 위치를 먼저 가져와 주세요.";

                return;

            }


            if (
                destinationLatitude === null ||
                destinationLongitude === null
            ) {

                return;

            }


            const lat1 =
                currentLatitude *
                Math.PI / 180;


            const lat2 =
                destinationLatitude *
                Math.PI / 180;


            const deltaLongitude =
                (
                    destinationLongitude -
                    currentLongitude
                )
                *
                Math.PI / 180;


            const y =
                Math.sin(deltaLongitude) *
                Math.cos(lat2);


            const x =
                Math.cos(lat1) *
                Math.sin(lat2)
                -
                Math.sin(lat1) *
                Math.cos(lat2) *
                Math.cos(deltaLongitude);


            let bearing =
                Math.atan2(y, x)
                *
                180 / Math.PI;


            bearing =
                normalizeAngle(bearing);


            destinationBearing =
                bearing;


            destinationInfo.innerHTML =

                `목적지<br>` +

                `위도: ` +
                `${destinationLatitude.toFixed(6)}<br>` +

                `경도: ` +
                `${destinationLongitude.toFixed(6)}<br>` +

                `<strong>` +
                `목적지 방위각: ` +
                `${bearing.toFixed(1)}°` +
                `</strong>`;


            updateCompass();

        }


        // =========================================
        // 지도 클릭 → 목적지 설정
        // =========================================

        map.on(

            "click",

            function(event) {

                destinationLatitude =
                    event.latlng.lat;


                destinationLongitude =
                    event.latlng.lng;


                // =================================
                // 기존 목적지 삭제
                // =================================

                if (
                    destinationMarker !== null
                ) {

                    map.removeLayer(
                        destinationMarker
                    );

                }


                // =================================
                // 목적지 마커
                // =================================

                destinationMarker =
                    L.marker(

                        [

                            destinationLatitude,
                            destinationLongitude

                        ]

                    )
                    .addTo(map);


                destinationMarker
                    .bindPopup("목적지")
                    .openPopup();


                // =================================
                // 방위각 계산
                // =================================

                calculateBearing();

            }

        );


        // =========================================
        // Quaternion → Heading
        // =========================================
        //
        // AbsoluteOrientationSensor의
        // quaternion을 이용해서
        // 스마트폰의 yaw 방향을 계산한다.
        //
        // 결과:
        // 0 ~ 360°
        //
        // 주의:
        // 기기 화면 방향과 브라우저 좌표계에 따라
        // 실제 북쪽과 오프셋이 생길 수 있다.
        //
        // =========================================

        function quaternionToHeading(
            quaternion
        ) {

            const x =
                quaternion[0];

            const y =
                quaternion[1];

            const z =
                quaternion[2];

            const w =
                quaternion[3];


            /*
             * quaternion에서
             * yaw 회전각을 계산한다.
             */

            const sinYaw =
                2 *
                (
                    w * z +
                    x * y
                );


            const cosYaw =
                1 -
                2 *
                (
                    y * y +
                    z * z
                );


            let yaw =
                Math.atan2(
                    sinYaw,
                    cosYaw
                )
                *
                180 /
                Math.PI;


            /*
             * -180~180
             * →
             * 0~360
             */

            yaw =
                normalizeAngle(yaw);


            return yaw;

        }


        // =========================================
        // AbsoluteOrientationSensor
        // =========================================

        function startAbsoluteOrientationSensor() {

            if (
                typeof AbsoluteOrientationSensor ===
                "undefined"
            ) {

                sensorInfo.innerHTML =
                    "AbsoluteOrientationSensor를 " +
                    "지원하지 않는 기기입니다.";

                return false;

            }


            try {

                orientationSensor =
                    new AbsoluteOrientationSensor({

                        frequency: 30

                    });


                // =================================
                // 센서 reading
                // =================================

                orientationSensor.addEventListener(

                    "reading",

                    function() {

                        const quaternion =
                            orientationSensor.quaternion;


                        if (
                            !quaternion
                        ) {

                            return;

                        }


                        /*
                         * quaternion → heading
                         */

                        const heading =
                            quaternionToHeading(
                                quaternion
                            );


                        currentHeading =
                            heading;


                        /*
                         * 센서 정보를 한 곳에서만
                         * 출력한다.
                         *
                         * 따라서 이전처럼
                         * 다른 이벤트와 화면을
                         * 서로 덮어쓰지 않는다.
                         */

                        sensorInfo.innerHTML =

                            `<strong>` +
                            `AbsoluteOrientationSensor 작동 중` +
                            `</strong><br><br>` +

                            `현재 heading: ` +
                            `${heading.toFixed(1)}°` +
                            `<br><br>` +

                            `Quaternion<br>` +

                            `x: ` +
                            `${quaternion[0].toFixed(4)}` +
                            `<br>` +

                            `y: ` +
                            `${quaternion[1].toFixed(4)}` +
                            `<br>` +

                            `z: ` +
                            `${quaternion[2].toFixed(4)}` +
                            `<br>` +

                            `w: ` +
                            `${quaternion[3].toFixed(4)}`;


                        /*
                         * 목적지가 있다면
                         * 나침반 즉시 업데이트
                         */

                        updateCompass();

                    }

                );


                // =================================
                // 센서 오류
                // =================================

                orientationSensor.addEventListener(

                    "error",

                    function(event) {

                        console.error(
                            event.error
                        );


                        sensorInfo.innerHTML =
                            `센서 오류: ` +
                            `${event.error.name}`;

                    }

                );


                // =================================
                // 센서 시작
                // =================================

                orientationSensor.start();


                return true;

            }

            catch (error) {

                console.error(error);


                sensorInfo.innerHTML =
                    `센서 시작 실패: ` +
                    `${error.name}`;


                return false;

            }

        }


        // =========================================
        // 나침반 시작
        // =========================================

        async function startCompass() {

            sensorInfo.textContent =
                "AbsoluteOrientationSensor 시작 중...";


            /*
             * AbsoluteOrientationSensor를
             * 시작한다.
             */

            const started =
                startAbsoluteOrientationSensor();


            if (
                !started
            ) {

                return;

            }


            sensorStarted =
                true;


            startButton.textContent =
                "나침반 작동 중";


            startButton.disabled =
                true;

        }


        // =========================================
        // 버튼
        // =========================================

        locationButton.addEventListener(

            "click",

            startLocationTracking

        );


        startButton.addEventListener(

            "click",

            startCompass

        );


        // =========================================
        // 초기 화면
        // =========================================

        showFrame(
            FRONT_FRAME - 1
        );


        // =========================================
        // 페이지 시작
        // =========================================

        startLocationTracking();


    </script>


</body>

</html>
