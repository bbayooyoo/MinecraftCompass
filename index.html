<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Minecraft Compass</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        crossorigin=""
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background: #111;
            color: white;

            font-family: Arial, sans-serif;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin: 20px 0;
        }

        #map {
            width: 95%;
            height: 500px;

            border-radius: 8px;
        }

        #locationInfo,
        #destinationInfo {
            width: 95%;
            max-width: 600px;

            margin-top: 15px;
            padding: 15px;

            background: #222;

            text-align: center;

            line-height: 1.6;
        }

        #destinationInfo {
            background: #333;
        }

        button {
            margin-top: 15px;

            padding: 12px 24px;

            border: none;
            border-radius: 6px;

            font-size: 16px;
        }

    </style>

</head>


<body>

    <h1>Minecraft Compass</h1>


    <!-- ==============================
         지도
    =============================== -->

    <div id="map"></div>


    <!-- ==============================
         현재 위치 정보
    =============================== -->

    <div id="locationInfo">
        현재 위치를 확인하는 중...
    </div>


    <!-- ==============================
         목적지 정보
    =============================== -->

    <div id="destinationInfo">
        지도를 터치해서 목적지를 선택하세요.
    </div>


    <button id="locationButton">
        현재 위치 가져오기
    </button>


    <!-- Leaflet JavaScript -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        crossorigin="">
    </script>


    <script>

        // =========================================
        // 지도 기본 설정
        // =========================================

        const initialLatitude = 37.5665;
        const initialLongitude = 126.9780;


        const map = L.map("map").setView(
            [initialLatitude, initialLongitude],
            15
        );


        // =========================================
        // OpenStreetMap
        // =========================================

        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 19,

                attribution:
                    '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
            }
        ).addTo(map);


        // =========================================
        // 현재 위치
        // =========================================

        let currentMarker = null;

        let currentLatitude = null;
        let currentLongitude = null;


        // =========================================
        // 목적지
        // =========================================

        let destinationMarker = null;

        let destinationLatitude = null;
        let destinationLongitude = null;


        // =========================================
        // 화면 요소
        // =========================================

        const locationInfo =
            document.getElementById("locationInfo");

        const destinationInfo =
            document.getElementById("destinationInfo");

        const locationButton =
            document.getElementById("locationButton");


        // =========================================
        // 각도를 0~360도로 정리
        // =========================================

        function normalizeAngle(angle) {

            return ((angle % 360) + 360) % 360;

        }


        // =========================================
        // 현재 위치 성공
        // =========================================

        function handleLocationSuccess(position) {

            currentLatitude =
                position.coords.latitude;

            currentLongitude =
                position.coords.longitude;


            const accuracy =
                position.coords.accuracy;


            // 현재 위치로 지도 이동

            map.setView(
                [
                    currentLatitude,
                    currentLongitude
                ],
                17
            );


            // 기존 현재 위치 마커 삭제

            if (currentMarker !== null) {

                map.removeLayer(currentMarker);

            }


            // 현재 위치 마커 생성

            currentMarker =
                L.marker(
                    [
                        currentLatitude,
                        currentLongitude
                    ]
                )
                .addTo(map);


            currentMarker
                .bindPopup("현재 위치")
                .openPopup();


            // 현재 위치 정보 표시

            locationInfo.innerHTML =
                `현재 위치<br>` +
                `위도: ${currentLatitude.toFixed(6)}<br>` +
                `경도: ${currentLongitude.toFixed(6)}<br>` +
                `위치 정확도: 약 ${accuracy.toFixed(1)} m`;


            locationButton.textContent =
                "현재 위치 업데이트";


            // 이미 목적지가 선택되어 있다면
            // 방위각 다시 계산

            if (
                destinationLatitude !== null &&
                destinationLongitude !== null
            ) {

                calculateBearing();

            }

        }


        // =========================================
        // 위치 가져오기 실패
        // =========================================

        function handleLocationError(error) {

            console.error(error);


            if (error.code === 1) {

                locationInfo.textContent =
                    "위치 권한이 거부되었습니다.";

            }
            else if (error.code === 2) {

                locationInfo.textContent =
                    "현재 위치를 확인할 수 없습니다.";

            }
            else if (error.code === 3) {

                locationInfo.textContent =
                    "위치 확인 시간이 초과되었습니다.";

            }
            else {

                locationInfo.textContent =
                    "위치를 가져오는 중 오류가 발생했습니다.";

            }

        }


        // =========================================
        // GPS
        // =========================================

        function getCurrentLocation() {

            if (!("geolocation" in navigator)) {

                locationInfo.textContent =
                    "이 브라우저는 위치 정보를 지원하지 않습니다.";

                return;

            }


            locationInfo.textContent =
                "현재 위치를 확인하는 중...";


            navigator.geolocation.getCurrentPosition(
                handleLocationSuccess,
                handleLocationError,
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );

        }


        // =========================================
        // 두 위치 사이의 방위각 계산
        // =========================================

        function calculateBearing() {

            // 현재 위치가 없으면 계산하지 않음

            if (
                currentLatitude === null ||
                currentLongitude === null
            ) {

                destinationInfo.textContent =
                    "먼저 현재 위치를 가져와 주세요.";

                return;

            }


            // 위도/경도를 라디안으로 변환

            const lat1 =
                currentLatitude * Math.PI / 180;

            const lat2 =
                destinationLatitude * Math.PI / 180;


            const longitudeDifference =
                (destinationLongitude - currentLongitude)
                * Math.PI / 180;


            // 방위각 계산

            const y =
                Math.sin(longitudeDifference) *
                Math.cos(lat2);


            const x =
                Math.cos(lat1) *
                Math.sin(lat2)
                -
                Math.sin(lat1) *
                Math.cos(lat2) *
                Math.cos(longitudeDifference);


            let bearing =
                Math.atan2(y, x)
                * 180 / Math.PI;


            // 0~360도로 변환

            bearing =
                normalizeAngle(bearing);


            // 화면 표시

            destinationInfo.innerHTML =
                `목적지<br>` +
                `위도: ${destinationLatitude.toFixed(6)}<br>` +
                `경도: ${destinationLongitude.toFixed(6)}<br>` +
                `<strong>목적지 방위각: ${bearing.toFixed(1)}°</strong>`;

        }


        // =========================================
        // 지도에서 목적지 선택
        // =========================================

        map.on(
            "click",
            function(event) {

                destinationLatitude =
                    event.latlng.lat;

                destinationLongitude =
                    event.latlng.lng;


                // 기존 목적지 마커 삭제

                if (destinationMarker !== null) {

                    map.removeLayer(destinationMarker);

                }


                // 새로운 목적지 마커 생성

                destinationMarker =
                    L.marker(
                        [
                            destinationLatitude,
                            destinationLongitude
                        ]
                    )
                    .addTo(map);


                destinationMarker
                    .bindPopup("목적지")
                    .openPopup();


                // 방위각 계산

                calculateBearing();

            }
        );


        // =========================================
        // 현재 위치 버튼
        // =========================================

        locationButton.addEventListener(
            "click",
            getCurrentLocation
        );


        // =========================================
        // 페이지 시작
        // =========================================

        getCurrentLocation();

    </script>

</body>

</html>
